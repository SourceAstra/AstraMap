<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>AstraMap - Starfield Independent Console</title>
    <script src="d3.min.js" defer></script>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="explore.css">
    <link rel="stylesheet" href="trace.css">
    <style>
        :root {
            --bg-color-1: #0f172a;
            --bg-color-2: #030712;
            --bg-gradient: linear-gradient(135deg, var(--bg-color-1) 0%, var(--bg-color-2) 100%);
            --panel-bg: rgba(30, 41, 59, 0.7);
            --panel-border: rgba(255, 255, 255, 0.08);
            --panel-blur: blur(4px);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --text-dim: #64748b;
            --accent-primary: #6366f1;
            --color-function: #38bdf8;
            --color-method: #fbbf24;
            --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            --font-main: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: var(--font-main);
            background: var(--bg-color-2);
            background-image: var(--bg-gradient);
            color: var(--text-main);
            overflow: hidden;
            height: 100vh;
        }
        header {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: var(--panel-bg);
            backdrop-filter: var(--panel-blur);
            border-bottom: 1px solid var(--panel-border);
            display: flex; align-items: center; padding: 0 20px; gap: 16px; z-index: 1000;
            box-shadow: var(--shadow-sm);
        }
        header h1 {
            font-size: 18px; font-weight: 800;
            background: linear-gradient(to right, #a855f7, #38bdf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        /* Navigation tabs */
        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: color 0.2s, background-color 0.2s;
        }
        .tab-btn:hover {
            color: var(--text-main);
            background: rgba(255,255,255,0.1);
        }
        .tab-btn.active {
            color: #fff;
            background: var(--accent-primary);
        }
        
        /* Core viewport */
        .view-panel {
            position: absolute;
            top: 56px;
            bottom: 0;
            left: 0;
            right: 0;
            width: 100%;
            height: calc(100vh - 56px);
            display: none;
        }
        .view-panel.active {
            display: block;
        }
        #view-explore {
            background: radial-gradient(circle at center, #0f172a 0%, #030712 100%);
        }
        #view-trace {
            background: #030712;
        }
        #global-breadcrumb-bar {
            position: fixed;
            top: 56px;
            left: 0;
            right: 0;
            height: 36px;
            background: rgba(15, 23, 42, 0.85);
            border-bottom: 1px solid var(--panel-border);
            display: flex;
            align-items: center;
            padding: 0 20px;
            font-size: 13px;
            color: var(--text-muted);
            z-index: 900;
        }
        .breadcrumb-item {
            cursor: pointer;
            margin-right: 8px;
        }
        .breadcrumb-item:hover {
            color: #fff;
        }

        /* About button */
        .about-btn {
            background: rgba(99, 102, 241, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.3);
            color: #a5b4fc;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            margin-left: auto;
        }
        .about-btn:hover {
            background: rgba(99, 102, 241, 0.3);
            color: #fff;
        }

        /* About modal */
        .about-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            /* Removed backdrop-filter to reduce GPU compositing overhead */
            z-index: 5000;
            display: none;
            justify-content: center;
            align-items: center;
        }
        .about-overlay.show {
            display: flex;
        }
        .about-modal {
            background: #1e293b;
            border: 1px solid rgba(99, 102, 241, 0.3);
            border-radius: 16px;
            width: 90%;
            max-width: 640px;
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }
        .about-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .about-header h2 {
            font-size: 18px;
            color: #f8fafc;
            font-weight: 700;
        }
        .about-close {
            background: none;
            border: none;
            color: #94a3b8;
            font-size: 24px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 4px;
            transition: all 0.2s;
        }
        .about-close:hover {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .about-body {
            padding: 24px;
        }
        .about-section {
            margin-bottom: 24px;
        }
        .about-section:last-child {
            margin-bottom: 0;
        }
        .about-section h3 {
            font-size: 14px;
            color: #60a5fa;
            margin-bottom: 12px;
            font-weight: 600;
        }
        .about-section p,
        .about-section li {
            font-size: 13px;
            color: #cbd5e1;
            line-height: 1.7;
        }
        .about-section ul {
            padding-left: 16px;
        }
        .about-section li {
            margin-bottom: 4px;
        }
        .about-highlight {
            color: #38bdf8;
            font-weight: 600;
        }
        .about-code {
            background: rgba(15, 23, 42, 0.8);
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 12px;
            color: #e2e8f0;
            overflow-x: auto;
            margin: 8px 0;
        }
        .about-code .comment {
            color: #64748b;
        }
        .about-code .cmd {
            color: #38bdf8;
        }
        .about-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            margin: 8px 0;
        }
        .about-table th,
        .about-table td {
            padding: 8px 10px;
            text-align: left;
            border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .about-table th {
            color: #94a3b8;
            font-weight: 600;
            background: rgba(15, 23, 42, 0.4);
        }
        .about-table td {
            color: #cbd5e1;
        }
        .about-table tr:last-child td {
            border-bottom: none;
        }
        .about-us {
            color: #38bdf8 !important;
            font-weight: 600;
        }
        .about-footer {
            padding: 16px 24px;
            border-top: 1px solid rgba(255,255,255,0.08);
            background: rgba(15, 23, 42, 0.4);
            text-align: center;
        }
        .about-footer p {
            font-size: 12px;
            color: #64748b;
            margin: 4px 0;
        }
        .about-footer .copyright {
            color: #94a3b8;
            font-weight: 500;
        }
    </style>
</head>
<body class="view-explore">
    <header>
        <h1>AstraMap</h1>
        <div style="width: 24px;"></div>
        <button id="btn-explore" class="tab-btn active">Explore</button>
        <button id="btn-trace" class="tab-btn">Trace</button>
        <div style="flex:1"></div>
    </header>

    <div id="global-breadcrumb-bar" style="display:none;">
        <div id="explore-breadcrumb"></div>
    </div>

    <!-- Explore Canvas -->
    <div id="view-explore" class="view-panel active">
        <div id="explore-canvas-container" style="width:100%; height:100%;"></div>
    </div>

    <!-- Trace Canvas -->
    <div id="view-trace" class="view-panel"></div>

    <script>
        // SourceAstra standalone runtime mocks
        window.G_CURRENT_VIEW = 'explore';
        window.G_GRAPH_MODE = 'projected';
        window.G_FILE_TO_MODULE = {};
        window.G_MODULES = [];
        
        window.i18n = {
            locale: 'zh',
            translations: { zh: {} }
        };
        
        window.isSourceDeclarationFile = function(f) { return false; };

        window.SourceAstra = window.SourceAstra || {};
        window.SourceAstra.traceInitialized = false;
        window.SourceAstra.apiPrefix = '/api/astramap/';
        window.saAuthHeaders = window.saAuthHeaders || function() { return {}; };
        window.saConsumeSSEStream = window.saConsumeSSEStream || async function(response, onEvent) {
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            while (true) {
                const { value, done } = await reader.read();
                if (done) break;
                buffer += decoder.decode(value, { stream: true });
                const frames = buffer.split('\n\n');
                buffer = frames.pop() || '';
                frames.forEach(frame => {
                    let event = 'message';
                    let data = '';
                    frame.split('\n').forEach(line => {
                        if (line.startsWith('event:')) event = line.slice(6).trim();
                        if (line.startsWith('data:')) data += line.slice(5).trimStart();
                    });
                    if (data) onEvent(event, data);
                });
            }
        };

        async function openTraceForSymbol(symbolId, symbolName) {
            await loadTraceModule();
            const sym = (window.G_DATA && window.G_DATA.symbols && window.G_DATA.symbols[symbolId])
                || { id: symbolId, name: symbolName || symbolId, type: 'function' };
            window.G_SELECTED = sym;
            activeTab = 'trace';
            window.G_CURRENT_VIEW = 'trace';
            btnTrace.classList.add('active');
            btnExplore.classList.remove('active');
            viewTrace.classList.add('active');
            viewExplore.classList.remove('active');
            document.body.className = 'view-trace';
            if (window.SourceAstra && typeof window.SourceAstra.initUnderstand === 'function') {
                window.SourceAstra.initUnderstand(sym);
            }
        }

        window.SourceAstra.openTraceForSymbol = openTraceForSymbol;
        window.SourceAstra.showContextMenu = function(x, y, key, name, docCtx) {
            const old = document.getElementById('astramap-context-menu');
            if (old) old.remove();
            const sym = window.G_DATA && window.G_DATA.symbols && window.G_DATA.symbols[key];
            const isFunction = !!(window.SourceAstra && typeof window.SourceAstra.isTraceableSymbol === 'function'
                ? window.SourceAstra.isTraceableSymbol(sym || { id: key, name: name, type: 'function' })
                : sym && (sym.type === 'function' || sym.kind === 'function' || sym.kind === 'method'));
            const menu = document.createElement('div');
            menu.id = 'astramap-context-menu';
            menu.style.cssText = `position:fixed;left:${x}px;top:${y}px;z-index:4000;min-width:176px;padding:6px;background:#111827;border:1px solid rgba(148,163,184,.28);border-radius:8px;box-shadow:0 18px 40px rgba(0,0,0,.36);color:#e5e7eb;font-size:13px;`;
            const addItem = (label, enabled, action) => {
                const item = document.createElement('button');
                item.type = 'button';
                item.textContent = label;
                item.disabled = !enabled;
                item.style.cssText = `width:100%;border:0;background:${enabled ? 'transparent' : 'rgba(148,163,184,.08)'};color:${enabled ? '#e5e7eb' : '#64748b'};padding:9px 10px;border-radius:6px;text-align:left;cursor:${enabled ? 'pointer' : 'not-allowed'};`;
                item.onmouseenter = () => { if (enabled) item.style.background = 'rgba(56,189,248,.16)'; };
                item.onmouseleave = () => { if (enabled) item.style.background = 'transparent'; };
                item.onclick = () => {
                    if (!enabled) return;
                    menu.remove();
                    action();
                };
                menu.appendChild(item);
            };
            addItem(isFunction ? 'Enter Trace Analysis' : 'Trace Analysis (Functions Only)', isFunction, () => {
                openTraceForSymbol(key, name);
            });

            const targets = docCtx && Array.isArray(docCtx.docTargets) ? docCtx.docTargets : [];
            targets.forEach(target => {
                const label = target.docType === 'file'
                    ? 'Generate File Understanding Doc'
                    : target.docKey === '__project__'
                        ? 'Generate Project Understanding Doc'
                        : 'Generate Directory Understanding Doc';
                addItem(label, !!(target.docType && target.docKey), () => {
                    if (window.SourceAstra && typeof window.SourceAstra.openDocForExplore === 'function') {
                        window.SourceAstra.openDocForExplore(target.docType, target.docKey, { autoGenerate: true });
                    }
                });
            });
            if (targets.length === 0 && key === '__project__') {
                addItem('Generate Project Understanding Doc', true, () => {
                    if (window.SourceAstra && typeof window.SourceAstra.openDocForExplore === 'function') {
                        window.SourceAstra.openDocForExplore('project', '__project__', { autoGenerate: true });
                    }
                });
            }
            if (!isFunction && targets.length === 0 && key !== '__project__') {
                addItem('No Actions Available', false, () => {});
            }
            document.body.appendChild(menu);
            const close = (event) => {
                if (!menu.contains(event.target)) {
                    menu.remove();
                    document.removeEventListener('mousedown', close);
                }
            };
            setTimeout(() => document.addEventListener('mousedown', close), 0);
        };

        // Lazy-load marked library mock for explore.js document preview
        window._lazyLibs = {
            marked: { loaded: false, src: 'marked.min.js', css: null }
        };
        window.loadLib = async function(name) {
            const lib = window._lazyLibs[name];
            if (!lib || lib.loaded) return;
            lib.loaded = true;
            if (lib.css) {
                const link = document.createElement('link');
                link.rel = 'stylesheet'; link.href = lib.css;
                document.head.appendChild(link);
            }
            await new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = lib.src; s.onload = resolve; s.onerror = reject;
                document.head.appendChild(s);
            });
        };

        // Override global fetch Authorization header to avoid auth blocking
        const originalFetch = window.fetch;
        window.fetch = function(input, init) {
            init = init || {};
            init.headers = init.headers || {};
            return originalFetch(input, init);
        };

        // About modal controls
        const aboutOverlay = document.getElementById('about-overlay');
        const aboutBtn = document.getElementById('btn-about');
        const aboutClose = document.getElementById('about-close');

        if (aboutBtn && aboutOverlay) {
            aboutBtn.addEventListener('click', () => {
                aboutOverlay.classList.add('show');
            });
        }
        if (aboutClose && aboutOverlay) {
            aboutClose.addEventListener('click', () => {
                aboutOverlay.classList.remove('show');
            });
            aboutOverlay.addEventListener('click', (e) => {
                if (e.target === aboutOverlay) {
                    aboutOverlay.classList.remove('show');
                }
            });
        }
        // ESC to close modal
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && aboutOverlay && aboutOverlay.classList.contains('show')) {
                aboutOverlay.classList.remove('show');
            }
        });
    </script>

    <script src="explore.js" defer></script>
    <script>
        let _traceLoaded = false;
        let _traceLoadPromise = null;
        const ASTRAMAP_ASSET_VERSION = '20260709-trace-dir-state';
        async function loadTraceModule() {
            if (_traceLoaded) return;
            if (_traceLoadPromise) return _traceLoadPromise;
            _traceLoadPromise = new Promise((resolve, reject) => {
                const s = document.createElement('script');
                s.src = `trace.js?v=${ASTRAMAP_ASSET_VERSION}`;
                s.onload = () => {
                    _traceLoaded = true;
                    resolve();
                };
                s.onerror = () => {
                    _traceLoadPromise = null;
                    reject(new Error('failed to load trace.js'));
                };
                document.head.appendChild(s);
            });
            return _traceLoadPromise;
        }
    </script>
    <script>
        // Tab switching logic
        let activeTab = 'explore';
        const btnExplore = document.getElementById('btn-explore');
        const btnTrace = document.getElementById('btn-trace');
        const viewExplore = document.getElementById('view-explore');
        const viewTrace = document.getElementById('view-trace');

        btnExplore.addEventListener('click', () => {
            activeTab = 'explore';
            window.G_CURRENT_VIEW = 'explore';
            btnExplore.classList.add('active');
            btnTrace.classList.remove('active');
            viewExplore.classList.add('active');
            viewTrace.classList.remove('active');
            document.body.className = 'view-explore';

            if (window.SourceAstra && typeof window.SourceAstra.initExplore === 'function') {
                window.SourceAstra.initExplore();
                window.SourceAstra.exploreLoad();
            }
            if (window.SourceAstra && window.SourceAstra.traceInitialized && typeof window.SourceAstra.refreshFunctionTree === 'function') {
                window.SourceAstra.refreshFunctionTree();
            }
        });

        btnTrace.addEventListener('click', async () => {
            activeTab = 'trace';
            window.G_CURRENT_VIEW = 'trace';
            btnTrace.classList.add('active');
            btnExplore.classList.remove('active');
            viewTrace.classList.add('active');
            viewExplore.classList.remove('active');
            document.body.className = 'view-trace';

            await loadTraceModule();
            // Initialize Trace view
            if (window.SourceAstra && typeof window.SourceAstra.initUnderstand === 'function') {
                window.SourceAstra.initUnderstand();
            }
        });

        function astraMapSymbolFromNode(s) {
            return {
                id: s.id,
                kind: s.kind || s.type,
                type: s.type || s.kind,
                name: s.name,
                qualifiedName: s.qualifiedName || s.name,
                file: s.file || s.filePath,
                filePath: s.filePath || s.file,
                line: s.line || s.startLine,
                startLine: s.startLine || s.line,
                endLine: s.endLine,
                startColumn: s.startColumn,
                endColumn: s.endColumn,
                signature: s.signature,
                docstring: s.docstring,
                isExported: s.isExported
            };
        }

        function astraMapInstallSymbols(nodes) {
            const symMap = {};
            const nameMap = {};
            const fileSet = new Set();
            window.G_FILE_TO_MODULE = {};
            (nodes || []).forEach(s => {
                const sym = astraMapSymbolFromNode(s);
                symMap[sym.id] = sym;
                nameMap[sym.name] = sym.id;
                if (sym.file) {
                    fileSet.add(sym.file);
                    const parts = sym.file.replace(/\\/g, '/').split('/');
                    const moduleId = parts.length > 1 && parts[0] ? parts[0] : '(root)';
                    window.G_FILE_TO_MODULE[sym.file] = { id: moduleId, name: moduleId };
                }
            });
            window.G_DATA = {
                symbols: symMap,
                nameMap: nameMap,
                edges: [],
                links: [],
                files: Array.from(fileSet).sort().map(file => ({ file_path: file }))
            };
        }

        async function astraMapLoadFullFallback() {
            const resNodes = await fetch('/api/astramap/data');
            const graphData = await resNodes.json();
            if (graphData.error) throw new Error(graphData.error);
            astraMapInstallSymbols(graphData.nodes || []);
            const edges = (graphData.edges || []).map(e => ({
                from: e.source,
                to: e.target,
                kind: e.kind,
                provenance: e.provenance,
                line: e.line,
                col: e.col
            }));
            window.G_DATA.edges = edges;
            window.G_DATA.links = edges;
            window.G_DATA.files = (graphData.files || []).map(f => ({ file_path: f.path }));
            window.G_GRAPH_MODE = 'full';
        }

        // Mount page components and fetch initial data
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                const [statusRes, overviewRes] = await Promise.all([
                    fetch('/api/astramap/status'),
                    fetch('/api/astramap/overview')
                ]);
                await statusRes.json();
                const overview = await overviewRes.json();
                if (overview.error) throw new Error(overview.error);
                window.G_PROJECTED_GRAPH = overview;
                window.G_MODULES = (overview.nodes || []).map(n => ({ id: n.id, name: n.name || n.id }));
                const hasLoadedSymbols = window.G_DATA && window.G_DATA.symbols && Object.keys(window.G_DATA.symbols).length > 0;
                if (!hasLoadedSymbols) {
                    astraMapInstallSymbols([]);
                }
            } catch(e) {
                console.warn("Failed to load AstraMap lightweight init data, falling back to full graph: ", e);
                try {
                    await astraMapLoadFullFallback();
                } catch(fullErr) {
                    console.error("Failed to load AstraMap init data: ", fullErr);
                    window.G_PROJECTED_GRAPH = { nodes: [], links: [] };
                    window.G_DATA = { symbols: {}, nameMap: {}, edges: [], links: [], files: [] };
                }
            }

            if (window.SourceAstra && typeof window.SourceAstra.initExplore === 'function') {
                window.SourceAstra.initExplore();
                window.SourceAstra.exploreLoad();
            }
        });
    </script>
</body>
</html>
