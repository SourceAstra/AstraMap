# 跨语言调用场景 — 验证12种内置语言的跨文件引用解析
metadata:
  language: multi
  description: "跨文件调用解析（12 种内置语言）"
  complexity: scenario
  scip_required: false

fixtures:
  - id: go_cross_file
    files:
      go.mod: "module test\n"
      defs.go: |
        package main
        func Calculate(x int) int { return x * 2 }
      usage.go: |
        package main
        func Use() int { return Calculate(10) }
    expected:
      symbols:
        - name: "Calculate"
          kind: function
        - name: "Use"
          kind: function
      calls:
        - caller: "Use"
          callee: "Calculate"

  - id: python_cross_file
    files:
      math_utils.py: |
        def calculate(x):
          return x * 2
      app.py: |
        from math_utils import calculate
        def process():
          return calculate(10)
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: typescript_cross_file
    files:
      package.json: |
        {"name": "test"}
      utils.ts: |
        export function calculate(x: number): number { return x * 2 }
      main.ts: |
        import { calculate } from './utils'
        function process(): number { return calculate(10) }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: javascript_cross_file
    files:
      utils.js: |
        export function calculate(x) { return x * 2; }
      main.js: |
        import { calculate } from './utils';
        function process() { return calculate(10); }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: c_cross_file
    files:
      math.h: |
        int calculate(int x);
      math.c: |
        int calculate(int x) { return x * 2; }
      main.c: |
        int main() { return calculate(10); }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "main"
          kind: function
      calls:
        - caller: "main"
          callee: "calculate"

  - id: cpp_cross_file
    files:
      math.cpp: |
        namespace Math {
            int calculate(int x) { return x * 2; }
        }
      main.cpp: |
        int main() { return 0; }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "main"
          kind: function

  - id: java_cross_file
    files:
      Calculator.java: |
        public class Calculator {
            public int calculate(int x) { return x * 2; }
        }
      Main.java: |
        public class Main {
            public int run() {
                Calculator c = new Calculator();
                return c.calculate(10);
            }
        }
    expected:
      symbols:
        - name: "Calculator"
          kind: class
        - name: "calculate"
          kind: method
        - name: "Main"
          kind: class
        - name: "run"
          kind: method

  - id: rust_cross_file
    files:
      Cargo.toml: |
        [package]
        name = "test"
        version = "0.1.0"
        edition = "2021"
      src/utils.rs: |
        pub fn calculate(x: i32) -> i32 { x * 2 }
      src/main.rs: |
        mod utils;
        fn process() -> i32 { utils::calculate(10) }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: csharp_cross_file
    files:
      Utils.cs: |
        namespace App {
          public class Calculator {
            public static int Calculate(int x) { return x * 2; }
          }
        }
      Program.cs: |
        using System;
        namespace App {
          class Program {
            static void Main() {
              Console.WriteLine(Calculator.Calculate(10));
            }
          }
        }
    expected:
      symbols:
        - name: "Calculator"
          kind: class
        - name: "Calculate"
          kind: method
        - name: "Main"
          kind: method

  - id: kotlin_cross_file
    files:
      Utils.kt: |
        package app
        fun calculate(x: Int): Int = x * 2
      Main.kt: |
        package app
        import app.calculate
        fun process(): Int = calculate(10)
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: php_cross_file
    files:
      utils.php: |
        <?php
        function calculate($x) { return $x * 2; }
      main.php: |
        <?php
        require_once 'utils.php';
        function process() { return calculate(10); }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: bash_cross_file
    files:
      utils.sh: |
        #!/bin/bash
        calculate() { echo $(( $1 * 2 )); }
      script.sh: |
        #!/bin/bash
        source utils.sh
        process() { calculate 10; }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function
