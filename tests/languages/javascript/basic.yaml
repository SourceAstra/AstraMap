# JavaScript 基础定义与调用提取
metadata:
  language: javascript
  description: "JavaScript 函数、类、方法、箭头函数、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: function_declaration
    files:
      main.js: |
        function add(a, b) {
          return a + b;
        }
    expected:
      symbols:
        - name: "add"
          kind: function

  - id: arrow_function
    files:
      main.js: |
        const multiply = (a, b) => a * b;
    expected:
      symbols:
        - name: "multiply"
          kind: function

  - id: class_definition
    files:
      main.js: |
        class Point {
          constructor(x, y) {
            this.x = x;
            this.y = y;
          }
          distance() {
            return this.x * this.x + this.y * this.y;
          }
        }
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "distance"
          kind: method

  - id: simple_call
    files:
      main.js: |
        function greet(name) {
          return "Hello, " + name;
        }
        function main() {
          greet("world");
        }
    expected:
      symbols:
        - name: "greet"
          kind: function
        - name: "main"
          kind: function
      calls:
        - caller: "main"
          callee: "greet"

  - id: method_call
    files:
      main.js: |
        class Calculator {
          add(a, b) { return a + b; }
          compute() { return this.add(1, 2); }
        }
    expected:
      symbols:
        - name: "Calculator"
          kind: class
        - name: "add"
          kind: method
        - name: "compute"
          kind: method

  - id: export_function
    files:
      utils.js: |
        export function parse(input) {
          return parseInt(input, 10);
        }
    expected:
      symbols:
        - name: "parse"
          kind: function

  - id: async_function
    files:
      main.js: |
        async function fetchData(url) {
          return await fetch(url);
        }
    expected:
      symbols:
        - name: "fetchData"
          kind: function

  - id: object_method
    files:
      main.js: |
        const utils = {
          log(msg) { console.log(msg); }
        };
    expected:
      symbols:
        - name: "log"
          kind: method

  - id: callback_function
    files:
      main.js: |
        function process(callback) {
          return callback(42);
        }
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: generator_function
    files:
      main.js: |
        function* idGenerator() {
          let id = 0;
          while (true) yield id++;
        }
    expected:
      symbols:
        - name: "idGenerator"
          kind: function

  - id: class_expression
    files:
      main.js: |
        const Rectangle = class {
          constructor(w, h) { this.w = w; this.h = h; }
          area() { return this.w * this.h; }
        };
    expected:
      symbols:
        - name: "Rectangle"
          kind: class
        - name: "area"
          kind: method

  - id: default_export_function
    files:
      main.js: |
        export default function greet(name) {
          return "Hello, " + name;
        }
    expected:
      symbols:
        - name: "greet"
          kind: function

  - id: destructuring_parameters
    files:
      main.js: |
        function display({ name, age }) {
          console.log(name, age);
        }
    expected:
      symbols:
        - name: "display"
          kind: function

  - id: rest_parameters
    files:
      main.js: |
        function sum(...numbers) {
          return numbers.reduce((a, b) => a + b, 0);
        }
    expected:
      symbols:
        - name: "sum"
          kind: function

  - id: iife
    files:
      main.js: |
        (function() {
          const secret = 42;
          console.log(secret);
        })();
    expected:
      symbols: []

  - id: getter_setter
    files:
      main.js: |
        class Circle {
          constructor(r) { this._r = r; }
          get radius() { return this._r; }
          set radius(v) { this._r = v; }
        }
    expected:
      symbols:
        - name: "Circle"
          kind: class
        - name: "radius"
          kind: method

  - id: static_method
    files:
      main.js: |
        class MathUtils {
          static add(a, b) { return a + b; }
          static multiply(a, b) { return a * b; }
        }
    expected:
      symbols:
        - name: "MathUtils"
          kind: class
        - name: "add"
          kind: method
        - name: "multiply"
          kind: method

  - id: template_literal_function
    files:
      main.js: |
        function greet(name) {
          return `Hello, ${name}!`;
        }
    expected:
      symbols:
        - name: "greet"
          kind: function
