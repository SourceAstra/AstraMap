# C 基础定义与调用提取
metadata:
  language: c
  description: "C 函数、结构体、宏、枚举、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: function_definition
    files:
      main.c: |
        int add(int a, int b) {
            return a + b;
        }
    expected:
      symbols:
        - name: "add"
          kind: function

  - id: struct_definition
    files:
      main.c: |
        typedef struct {
            int x;
            int y;
        } Point;
    expected:
      symbols:
        - name: "Point"
          kind: type

  - id: macro_definition
    files:
      main.c: |
        #define MAX_SIZE 100
        #define ADD(a, b) ((a) + (b))
    expected:
      symbols:
        - name: "MAX_SIZE"
          kind: macro
        - name: "ADD"
          kind: macro

  - id: enum_definition
    files:
      main.c: |
        enum Color { RED, GREEN, BLUE };
    expected:
      symbols:
        - name: "Color"
          kind: enum

  - id: typedef_simple
    files:
      main.c: |
        typedef int Handle;
    expected:
      symbols:
        - name: "Handle"
          kind: type

  - id: simple_call
    files:
      main.c: |
        int add(int a, int b) { return a + b; }
        int main() { return add(1, 2); }
    expected:
      symbols:
        - name: "add"
          kind: function
        - name: "main"
          kind: function
      calls:
        - caller: "main"
          callee: "add"

  - id: object_macro
    files:
      main.c: |
        #define VERSION "1.0"
        #define PI 3.14
    expected:
      symbols:
        - name: "VERSION"
          kind: macro
        - name: "PI"
          kind: macro

  - id: multi_function
    files:
      main.c: |
        int max(int a, int b) { return a > b ? a : b; }
        int min(int a, int b) { return a < b ? a : b; }
        int clamp(int v, int lo, int hi) { return max(lo, min(v, hi)); }
    expected:
      symbols:
        - name: "max"
          kind: function
        - name: "min"
          kind: function
        - name: "clamp"
          kind: function

  - id: typedef_struct_named
    files:
      main.c: |
        struct Node {
            int value;
            struct Node *next;
        };
    expected:
      symbols:
        - name: "Node"
          kind: struct

  - id: union_definition
    files:
      main.c: |
        union Data {
            int i;
            float f;
            char c;
        };
    expected:
      symbols:
        - name: "Data"
          kind: struct

  - id: static_function
    files:
      main.c: |
        static int helper(int x) { return x * 2; }
        int main() { return helper(5); }
    expected:
      symbols:
        - name: "helper"
          kind: function
        - name: "main"
          kind: function

  - id: extern_declaration
    files:
      main.c: |
        extern int global_count;
        extern void external_func(void);
        int main() { return 0; }
    expected:
      symbols:
        - name: "main"
          kind: function

  - id: const_qualifier
    files:
      main.c: |
        const int MAX = 100;
        int get_max() { return MAX; }
    expected:
      symbols:
        - name: "get_max"
          kind: function

  - id: volatile_variable
    files:
      main.c: |
        volatile int sensor_value;
        int read_sensor() { return sensor_value; }
    expected:
      symbols:
        - name: "read_sensor"
          kind: function

  - id: function_pointer
    files:
      main.c: |
        int apply(int (*op)(int, int), int a, int b) {
            return op(a, b);
        }
    expected:
      symbols:
        - name: "apply"
          kind: function

  - id: bit_field
    files:
      main.c: |
        struct Flags {
            unsigned int flag1 : 1;
            unsigned int flag2 : 1;
            unsigned int reserved : 6;
        };
    expected:
      symbols:
        - name: "Flags"
          kind: struct

  - id: array_parameter
    files:
      main.c: |
        int sum(int arr[], int n) {
            int total = 0;
            for (int i = 0; i < n; i++) total += arr[i];
            return total;
        }
    expected:
      symbols:
        - name: "sum"
          kind: function

  - id: do_while_loop
    files:
      main.c: |
        int factorial(int n) {
            int result = 1;
            do { result *= n--; } while (n > 1);
            return result;
        }
    expected:
      symbols:
        - name: "factorial"
          kind: function
