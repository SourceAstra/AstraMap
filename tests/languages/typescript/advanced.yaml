# TypeScript 高级语义场景
metadata:
  language: typescript
  description: "TypeScript 跨文件调用、泛型约束、命名空间"
  complexity: advanced
  scip_required: false

fixtures:
  - id: cross_file_call
    files:
      utils.ts: |
        export function calculate(x: number): number { return x * 2 }
      main.ts: |
        import { calculate } from './utils'
        function process(): number { return calculate(10) }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: generic_class
    files:
      container.ts: |
        class Container<T> {
            private value: T;
            constructor(value: T) { this.value = value; }
            get(): T { return this.value; }
        }
    expected:
      symbols:
        - name: "Container"
          kind: class
        - name: "get"
          kind: method

  - id: interface_implementation
    files:
      shapes.ts: |
        interface Printable { print(): void }
        class Report implements Printable {
            print(): void { console.log("report") }
        }
    expected:
      symbols:
        - name: "Printable"
          kind: interface
        - name: "Report"
          kind: class
        - name: "print"
          kind: method

  - id: namespace_with_export
    # tree-sitter 不提取 namespace 节点，但提取其中的函数和类
    files:
      ns.ts: |
        namespace API {
            export function fetch(url: string): void {}
            export class Client {}
        }
    expected:
      symbols:
        - name: "fetch"
          kind: function
        - name: "Client"
          kind: class

  - id: class_with_method
    # 替代 abstract_class（tree-sitter 不提取 abstract class 节点）
    files:
      base.ts: |
        class Shape {
            area(): number { return 0; }
            describe(): string { return "shape" }
        }
    expected:
      symbols:
        - name: "Shape"
          kind: class
        - name: "area"
          kind: method
        - name: "describe"
          kind: method

  - id: async_await_function
    files:
      main.ts: |
        async function fetchData(url: string): Promise<string> {
          return fetch(url).then(r => r.text());
        }
    expected:
      symbols:
        - name: "fetchData"
          kind: function

  - id: type_union_intersection
    files:
      main.ts: |
        type Animal = { name: string };
        type Dog = Animal & { breed: string };
        type Pet = Dog | { type: "cat" };
    expected:
      symbols:
        - name: "Animal"
          kind: type
        - name: "Dog"
          kind: type
        - name: "Pet"
          kind: type

  - id: interface_extends
    files:
      main.ts: |
        interface Animal { name: string; }
        interface Dog extends Animal { breed: string; }
    expected:
      symbols:
        - name: "Animal"
          kind: interface
        - name: "Dog"
          kind: interface

  - id: class_static_method
    files:
      main.ts: |
        class Utils {
          static parse(input: string): number {
            return parseInt(input, 10);
          }
        }
    expected:
      symbols:
        - name: "Utils"
          kind: class
        - name: "parse"
          kind: method

  - id: function_overload
    files:
      main.ts: |
        function process(input: string): string;
        function process(input: number): number;
        function process(input: any): any {
          return input;
        }
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: readonly_array
    files:
      main.ts: |
        function sum(numbers: readonly number[]): number {
          return numbers.reduce((a, b) => a + b, 0);
        }
    expected:
      symbols:
        - name: "sum"
          kind: function

  - id: mapped_type_util
    files:
      main.ts: |
        type Readonly<T> = { readonly [K in keyof T]: T[K] };
        type Required<T> = { [K in keyof T]-?: T[K] };
    expected:
      symbols:
        - name: "Readonly"
          kind: type
        - name: "Required"
          kind: type
