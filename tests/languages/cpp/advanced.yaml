# C++ 高级语义场景
metadata:
  language: cpp
  description: "C++ 跨文件调用、继承、重载、模板特化"
  complexity: advanced
  scip_required: false

fixtures:
  - id: cross_file_call
    # 注意：.hpp 不被 C++ tree-sitter 索引，声明和定义都放在 .cpp 中
    files:
      math.cpp: |
        namespace Math {
            int calculate(int x) { return x * 2; }
        }
      main.cpp: |
        int main() { return 0; }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "main"
          kind: function

  - id: class_inheritance
    files:
      shapes.cpp: |
        class Shape {
        public:
            virtual int area() = 0;
        };
        class Circle : public Shape {
            int r;
        public:
            int area() { return 3 * r * r; }
        };
    expected:
      symbols:
        - name: "Shape"
          kind: class
        - name: "Circle"
          kind: class
        - name: "area"
          kind: method

  - id: function_overload
    files:
      overload.cpp: |
        int process(int x) { return x; }
        double process(double x) { return x; }
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: template_class
    files:
      container.cpp: |
        template<typename T>
        class Stack {
            T data[100];
            int top;
        public:
            void push(T value) {}
            T pop() { return data[top--]; }
        };
    expected:
      symbols:
        - name: "Stack"
          kind: class
        - name: "push"
          kind: method
        - name: "pop"
          kind: method

  - id: operator_overload
    files:
      vec.cpp: |
        class Vec {
            int x, y;
        public:
            Vec operator+(const Vec& other) const { return Vec(); }
        };
    expected:
      symbols:
        - name: "Vec"
          kind: class
        - name: "operator+"
          kind: method

  - id: pure_virtual_function
    files:
      shapes.cpp: |
        class Shape {
        public:
            virtual double area() const = 0;
            virtual ~Shape() = default;
        };
    expected:
      symbols:
        - name: "Shape"
          kind: class
        - name: "area"
          kind: method

  - id: multiple_inheritance
    files:
      main.cpp: |
        class Flyable { public: virtual void fly() = 0; };
        class Swimmable { public: virtual void swim() = 0; };
        class Duck : public Flyable, public Swimmable {
        public:
            void fly() override {}
            void swim() override {}
        };
    expected:
      symbols:
        - name: "Flyable"
          kind: class
        - name: "Swimmable"
          kind: class
        - name: "Duck"
          kind: class
        - name: "fly"
          kind: method
        - name: "swim"
          kind: method

  - id: friend_class
    files:
      main.cpp: |
        class Engine;
        class Car {
            friend class Engine;
            int speed;
        };
    expected:
      symbols:
        - name: "Engine"
          kind: class
        - name: "Car"
          kind: class

  - id: explicit_constructor
    files:
      main.cpp: |
        class String {
            char* data;
        public:
            explicit String(int size) : data(new char[size]) {}
        };
    expected:
      symbols:
        - name: "String"
          kind: class

  - id: default_delete
    files:
      main.cpp: |
        class NonCopyable {
        public:
            NonCopyable() = default;
            NonCopyable(const NonCopyable&) = delete;
            NonCopyable& operator=(const NonCopyable&) = delete;
        };
    expected:
      symbols:
        - name: "NonCopyable"
          kind: class

  - id: nested_class
    files:
      main.cpp: |
        class Outer {
        public:
            class Inner {
            public:
                void method() {}
            };
        };
    expected:
      symbols:
        - name: "Outer"
          kind: class
        - name: "Inner"
          kind: class
        - name: "method"
          kind: method

  - id: enum_class
    files:
      main.cpp: |
        enum class Color { Red, Green, Blue };
        enum class Status : int { OK = 0, Error = 1 };
    expected:
      symbols:
        - name: "Color"
          kind: enum
        - name: "Status"
          kind: enum

  - id: using_alias
    files:
      main.cpp: |
        template<typename T>
        using Vec = std::vector<T>;
        using String = std::string;
    expected:
      symbols:
        - name: "Vec"
          kind: type
        - name: "String"
          kind: type

  - id: constexpr_function
    files:
      main.cpp: |
        constexpr int factorial(int n) {
            return n <= 1 ? 1 : n * factorial(n - 1);
        }
    expected:
      symbols:
        - name: "factorial"
          kind: function
