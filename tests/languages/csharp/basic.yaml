# C# 基础定义与调用提取
metadata:
  language: csharp
  description: "C# 类、接口、方法、属性、命名空间、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: class_definition
    files:
      Program.cs: |
        using System;
        namespace App {
          class Point {
            public int X { get; set; }
            public int Y { get; set; }
            public double Distance() {
              return Math.Sqrt(X * X + Y * Y);
            }
          }
        }
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "Distance"
          kind: method

  - id: interface_definition
    files:
      Program.cs: |
        namespace App {
          interface IReader {
            byte[] Read();
          }
        }
    expected:
      symbols:
        - name: "IReader"
          kind: interface
        - name: "Read"
          kind: method

  - id: method_definition
    files:
      Program.cs: |
        namespace App {
          class Calculator {
            public int Add(int a, int b) {
              return a + b;
            }
          }
        }
    expected:
      symbols:
        - name: "Calculator"
          kind: class
        - name: "Add"
          kind: method

  - id: simple_call
    files:
      Program.cs: |
        using System;
        namespace App {
          class Program {
            static int Calculate(int x) { return x * 2; }
            static void Main() {
              Console.WriteLine(Calculate(10));
            }
          }
        }
    expected:
      symbols:
        - name: "Calculate"
          kind: method
        - name: "Main"
          kind: method

  - id: enum_definition
    files:
      Program.cs: |
        namespace App {
          enum Status {
            Pending,
            Active,
            Completed
          }
        }
    expected:
      symbols:
        - name: "Status"
          kind: enum

  - id: struct_definition
    files:
      Program.cs: |
        namespace App {
          struct Vector {
            public float X;
            public float Y;
          }
        }
    expected:
      symbols:
        - name: "Vector"
          kind: struct

  - id: property_definition
    files:
      Program.cs: |
        namespace App {
          class Person {
            public string Name { get; set; }
            public int Age { get; set; }
          }
        }
    expected:
      symbols:
        - name: "Person"
          kind: class

  - id: static_method
    files:
      Program.cs: |
        namespace App {
          class Utils {
            public static int Max(int a, int b) {
              return a > b ? a : b;
            }
          }
        }
    expected:
      symbols:
        - name: "Utils"
          kind: class
        - name: "Max"
          kind: method

  - id: generic_class
    files:
      Program.cs: |
        namespace App {
          class Box<T> {
            public T Value { get; set; }
          }
        }
    expected:
      symbols:
        - name: "Box"
          kind: class

  - id: delegate_definition
    files:
      Program.cs: |
        namespace App {
          delegate int Operation(int a, int b);
        }
    expected:
      symbols:
        - name: "Operation"
          kind: type

  - id: event_declaration
    files:
      Program.cs: |
        namespace App {
          class Publisher {
            public event EventHandler? DataChanged;
            public void Notify() { DataChanged?.Invoke(this, EventArgs.Empty); }
          }
        }
    expected:
      symbols:
        - name: "Publisher"
          kind: class
        - name: "Notify"
          kind: method

  - id: indexer_definition
    files:
      Program.cs: |
        namespace App {
          class Collection {
            private int[] _items = new int[10];
            public int this[int index] {
              get { return _items[index]; }
              set { _items[index] = value; }
            }
          }
        }
    expected:
      symbols:
        - name: "Collection"
          kind: class

  - id: partial_class
    files:
      Program.cs: |
        namespace App {
          partial class Data {
            public int Id { get; set; }
          }
          partial class Data {
            public string Name { get; set; }
          }
        }
    expected:
      symbols:
        - name: "Data"
          kind: class

  - id: abstract_class
    files:
      Program.cs: |
        namespace App {
          abstract class Animal {
            public abstract string Speak();
            public virtual void Move() {}
          }
        }
    expected:
      symbols:
        - name: "Animal"
          kind: class
        - name: "Speak"
          kind: method
        - name: "Move"
          kind: method

  - id: readonly_property
    files:
      Program.cs: |
        namespace App {
          class Config {
            public string Name { get; }
            public Config(string name) { Name = name; }
          }
        }
    expected:
      symbols:
        - name: "Config"
          kind: class

  - id: out_parameter
    files:
      Program.cs: |
        namespace App {
          class Parser {
            public bool TryParse(string s, out int result) {
              result = 0;
              return int.TryParse(s, out result);
            }
          }
        }
    expected:
      symbols:
        - name: "Parser"
          kind: class
        - name: "TryParse"
          kind: method

  - id: nullable_reference
    files:
      Program.cs: |
        namespace App {
          class NullableDemo {
            public string? GetName() { return null; }
          }
        }
    expected:
      symbols:
        - name: "NullableDemo"
          kind: class
        - name: "GetName"
          kind: method

  - id: tuple_deconstruction
    files:
      Program.cs: |
        namespace App {
          class TupleDemo {
            public (int, string) GetData() { return (1, "test"); }
          }
        }
    expected:
      symbols:
        - name: "TupleDemo"
          kind: class
        - name: "GetData"
          kind: method
