# Python 边界与边缘场景
metadata:
  language: python
  description: "Python 装饰器链、元类、描述符、上下文管理器、生成器表达式、lambda、类型注解、dataclass、property、staticmethod、classmethod、__slots__、抽象基类、多重继承、MRO、弱引用、GIL相关"
  complexity: edge_cases
  scip_required: false

fixtures:
  - id: decorator_chain
    files:
      main.py: |
        def retry(times):
            def decorator(func):
                def wrapper(*args, **kwargs):
                    for _ in range(times):
                        return func(*args, **kwargs)
                return wrapper
            return decorator

        @retry(3)
        @cache
        def fetch(url):
            return url
    expected:
      symbols:
        - name: "retry"
          kind: function
        - name: "fetch"
          kind: function

  - id: metaclass
    files:
      main.py: |
        class Meta(type):
            def __new__(mcs, name, bases, namespace):
                return super().__new__(mcs, name, bases, namespace)

        class Model(metaclass=Meta):
            pass
    expected:
      symbols:
        - name: "Meta"
          kind: class
        - name: "Model"
          kind: class

  - id: descriptor
    files:
      main.py: |
        class Validator:
            def __set_name__(self, owner, name):
                self.name = name
            def __get__(self, obj, objtype=None):
                return obj.__dict__[self.name]
            def __set__(self, obj, value):
                obj.__dict__[self.name] = value

        class Point:
            x = Validator()
            y = Validator()
    expected:
      symbols:
        - name: "Validator"
          kind: class
        - name: "Point"
          kind: class

  - id: type_annotations
    files:
      main.py: |
        from typing import List, Dict, Optional

        def process(items: List[int], config: Dict[str, str]) -> Optional[str]:
            return None
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: dataclass
    files:
      main.py: |
        from dataclasses import dataclass

        @dataclass(frozen=True)
        class Point:
            x: float
            y: float

            def distance(self) -> float:
                return (self.x ** 2 + self.y ** 2) ** 0.5
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "distance"
          kind: method

  - id: abstract_base_class
    files:
      main.py: |
        from abc import ABC, abstractmethod

        class Shape(ABC):
            @abstractmethod
            def area(self) -> float:
                pass

        class Circle(Shape):
            def __init__(self, radius: float):
                self.radius = radius
            def area(self) -> float:
                return 3.14 * self.radius ** 2
    expected:
      symbols:
        - name: "Shape"
          kind: class
        - name: "Circle"
          kind: class
        - name: "area"
          kind: method

  - id: multiple_inheritance
    files:
      main.py: |
        class Flyable:
            def fly(self): pass

        class Swimmable:
            def swim(self): pass

        class Duck(Flyable, Swimmable):
            def quack(self): pass
    expected:
      symbols:
        - name: "Flyable"
          kind: class
        - name: "Swimmable"
          kind: class
        - name: "Duck"
          kind: class
        - name: "quack"
          kind: method

  - id: generator_expression
    files:
      main.py: |
        def process():
            return (x * 2 for x in range(10) if x % 2 == 0)
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: weakref_callback
    files:
      main.py: |
        import weakref

        class Data:
            def __init__(self, value):
                self.value = value

        def on_finalize(ref):
            pass

        d = Data(42)
        ref = weakref.ref(d, on_finalize)
    expected:
      symbols:
        - name: "Data"
          kind: class
        - name: "on_finalize"
          kind: function

  - id: match_statement
    files:
      main.py: |
        def http_status(code):
            match code:
                case 200:
                    return "OK"
                case 404:
                    return "Not Found"
                case _:
                    return "Unknown"
    expected:
      symbols:
        - name: "http_status"
          kind: function

  - id: exception_group
    files:
      main.py: |
        def handle_errors():
            try:
                raise ExceptionGroup("group", [ValueError(), TypeError()])
            except* ValueError:
                pass
    expected:
      symbols:
        - name: "handle_errors"
          kind: function

  - id: type_param_generic
    files:
      main.py: |
        from typing import TypeVar, Generic
        T = TypeVar('T')
        class Stack(Generic[T]):
            def push(self, item: T) -> None: pass
            def pop(self) -> T: pass
    expected:
      symbols:
        - name: "Stack"
          kind: class
        - name: "push"
          kind: method
        - name: "pop"
          kind: method

  - id: protocol_definition
    files:
      main.py: |
        from typing import Protocol
        class Drawable(Protocol):
            def draw(self) -> None: ...
        class Circle:
            def draw(self) -> None: pass
    expected:
      symbols:
        - name: "Drawable"
          kind: class
        - name: "Circle"
          kind: class
        - name: "draw"
          kind: method

  - id: singledispatch
    files:
      main.py: |
        from functools import singledispatch
        @singledispatch
        def process(arg):
            return "default"
        @process.register(int)
        def _(arg):
            return "int"
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: enum_definition
    files:
      main.py: |
        from enum import Enum, auto
        class Color(Enum):
            RED = auto()
            GREEN = auto()
            BLUE = auto()
    expected:
      symbols:
        - name: "Color"
          kind: class

  - id: namedtuple_definition
    files:
      main.py: |
        from collections import namedtuple
        Point = namedtuple('Point', ['x', 'y'])
    expected:
      symbols:
        - name: "Point"
          kind: class

  - id: async_generator
    files:
      main.py: |
        async def fetch_pages():
            for i in range(3):
                yield f"page-{i}"
    expected:
      symbols:
        - name: "fetch_pages"
          kind: function

  - id: contextlib_contextmanager
    files:
      main.py: |
        from contextlib import contextmanager
        @contextmanager
        def managed_resource():
            yield "resource"
    expected:
      symbols:
        - name: "managed_resource"
          kind: function
