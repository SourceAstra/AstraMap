# Python 高级语义场景
metadata:
  language: python
  description: "Python 跨文件调用、继承、生成器、属性"
  complexity: advanced
  scip_required: false

fixtures:
  - id: cross_file_call
    files:
      math_utils.py: |
        def calculate(x):
            return x * 2
      app.py: |
          from math_utils import calculate
          def process():
              return calculate(10)
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: class_inheritance
    files:
      model.py: |
        class Animal:
            def speak(self):
                pass
        class Dog(Animal):
            def speak(self):
                return "Woof"
    expected:
      symbols:
        - name: "Animal"
          kind: class
        - name: "Dog"
          kind: class
        - name: "speak"
          kind: method

  - id: generator_function
    files:
      gen.py: |
        def fibonacci(n):
            a, b = 0, 1
            for _ in range(n):
                yield a
                a, b = b, a + b
    expected:
      symbols:
        - name: "fibonacci"
          kind: function

  - id: property_decorator
    files:
      model.py: |
        class Circle:
            def __init__(self, radius):
                self._radius = radius
            @property
            def area(self):
                return 3.14 * self._radius ** 2
    expected:
      symbols:
        - name: "Circle"
          kind: class
        - name: "area"
          kind: method

  - id: context_manager
    files:
      ctx.py: |
        class FileManager:
            def __enter__(self):
                return self
            def __exit__(self, *args):
                pass
    expected:
      symbols:
        - name: "FileManager"
          kind: class
        - name: "__enter__"
          kind: method
        - name: "__exit__"
          kind: method

  - id: mixin_pattern
    files:
      model.py: |
        class TimestampMixin:
            def created_at(self):
                return "now"
        class User(TimestampMixin):
            def name(self):
                return "user"
    expected:
      symbols:
        - name: "TimestampMixin"
          kind: class
        - name: "User"
          kind: class
        - name: "created_at"
          kind: method
        - name: "name"
          kind: method

  - id: property_setter
    files:
      model.py: |
        class Temperature:
            def __init__(self):
                self._c = 0
            @property
            def celsius(self):
                return self._c
            @celsius.setter
            def celsius(self, value):
                self._c = value
    expected:
      symbols:
        - name: "Temperature"
          kind: class
        - name: "celsius"
          kind: method

  - id: classmethod_factory
    files:
      model.py: |
        class Vehicle:
            def __init__(self, brand):
                self.brand = brand
            @classmethod
            def from_json(cls, data):
                return cls(data["brand"])
    expected:
      symbols:
        - name: "Vehicle"
          kind: class
        - name: "from_json"
          kind: method

  - id: nested_function
    files:
      main.py: |
        def outer():
            def inner():
                return 42
            return inner()
    expected:
      symbols:
        - name: "outer"
          kind: function
        - name: "inner"
          kind: function

  - id: partial_function
    files:
      main.py: |
        from functools import partial
        def add(a, b):
            return a + b
        add_five = partial(add, 5)
    expected:
      symbols:
        - name: "add"
          kind: function
