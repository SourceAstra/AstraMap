# Python 基础定义与调用提取
metadata:
  language: python
  description: "Python 类、函数、方法、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: class_definition
    files:
      main.py: |
        class Point:
            def __init__(self, x, y):
                self.x = x
                self.y = y
    expected:
      symbols:
        - name: "Point"
          kind: class

  - id: function_definition
    files:
      main.py: |
        def greet(name):
            return f"Hello, {name}"
    expected:
      symbols:
        - name: "greet"
          kind: function

  - id: simple_call
    files:
      main.py: |
        def add(a, b):
            return a + b
        def main():
            result = add(1, 2)
    expected:
      symbols:
        - name: "add"
          kind: function
        - name: "main"
          kind: function
      calls:
        - caller: "main"
          callee: "add"

  - id: nested_class
    files:
      main.py: |
        class Outer:
            class Inner:
                value = 1
    expected:
      symbols:
        - name: "Outer"
          kind: class
        - name: "Inner"
          kind: class

  - id: static_method
    files:
      main.py: |
        class Utils:
            @staticmethod
            def helper():
                return 42
    expected:
      symbols:
        - name: "Utils"
          kind: class
        - name: "helper"
          kind: method

  - id: class_method
    files:
      main.py: |
        class Factory:
            @classmethod
            def create(cls):
                return cls()
    expected:
      symbols:
        - name: "Factory"
          kind: class
        - name: "create"
          kind: method

  - id: async_function
    files:
      main.py: |
        async def fetch_data(url):
            pass
    expected:
      symbols:
        - name: "fetch_data"
          kind: function

  - id: decorator_function
    files:
      main.py: |
        def my_decorator(func):
            def wrapper():
                return func()
            return wrapper

        @my_decorator
        def decorated():
            pass
    expected:
      symbols:
        - name: "my_decorator"
          kind: function
        - name: "wrapper"
          kind: function
        - name: "decorated"
          kind: function

  - id: import_statement
    files:
      main.py: |
        import os
        import sys
    expected:
      symbols: []

  - id: multiple_classes
    files:
      main.py: |
        class Dog:
            def bark(self):
                pass
        class Cat:
            def meow(self):
                pass
    expected:
      symbols:
        - name: "Dog"
          kind: class
        - name: "Cat"
          kind: class
        - name: "bark"
          kind: method
        - name: "meow"
          kind: method

  - id: lambda_expression
    files:
      main.py: |
        square = lambda x: x * x
        def main():
            return square(5)
    expected:
      symbols:
        - name: "main"
          kind: function

  - id: list_comprehension
    files:
      main.py: |
        def process():
            return [x * 2 for x in range(10) if x % 2 == 0]
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: try_except_block
    files:
      main.py: |
        def safe_divide(a, b):
            try:
                return a / b
            except ZeroDivisionError:
                return 0
    expected:
      symbols:
        - name: "safe_divide"
          kind: function

  - id: with_statement
    files:
      main.py: |
        def read_file(path):
            with open(path) as f:
                return f.read()
    expected:
      symbols:
        - name: "read_file"
          kind: function

  - id: f_string_usage
    files:
      main.py: |
        def greet(name):
            return f"Hello, {name}!"
    expected:
      symbols:
        - name: "greet"
          kind: function

  - id: global_nonlocal
    files:
      main.py: |
        counter = 0
        def increment():
            global counter
            counter += 1
        def outer():
            x = 0
            def inner():
                nonlocal x
                x += 1
            return inner
    expected:
      symbols:
        - name: "increment"
          kind: function
        - name: "outer"
          kind: function
        - name: "inner"
          kind: function

  - id: type_hinting
    files:
      main.py: |
        from typing import List, Dict, Optional
        def process(items: List[int]) -> Optional[Dict[str, int]]:
            return None
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: walrus_operator
    files:
      main.py: |
        def demo():
            if (n := len("hello")) > 3:
                return n
    expected:
      symbols:
        - name: "demo"
          kind: function
