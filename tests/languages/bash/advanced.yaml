# Bash 高级语义场景
metadata:
  language: bash
  description: "Bash 跨文件调用、复杂控制流、管道、子shell"
  complexity: advanced
  scip_required: false

fixtures:
  - id: cross_file_call
    files:
      utils.sh: |
        #!/bin/bash
        calculate() {
          echo $(( $1 * 2 ))
        }
      script.sh: |
        #!/bin/bash
        source utils.sh
        process() {
          calculate 10
        }
    expected:
      symbols:
        - name: "calculate"
          kind: function
        - name: "process"
          kind: function

  - id: pipeline_and_subshell
    files:
      script.sh: |
        #!/bin/bash
        filter_results() {
          cat data.txt | grep "match" | sort | uniq
        }
    expected:
      symbols:
        - name: "filter_results"
          kind: function

  - id: command_substitution
    files:
      script.sh: |
        #!/bin/bash
        get_version() {
          local ver=$(cat VERSION)
          echo "$ver"
        }
    expected:
      symbols:
        - name: "get_version"
          kind: function

  - id: trap_and_signal
    files:
      script.sh: |
        #!/bin/bash
        cleanup() {
          echo "cleaning up"
          rm -f temp.txt
        }
        trap cleanup EXIT
    expected:
      symbols:
        - name: "cleanup"
          kind: function

  - id: associative_array
    files:
      script.sh: |
        #!/bin/bash
        declare -A config
        load_config() {
          config[key1]="value1"
          config[key2]="value2"
        }
    expected:
      symbols:
        - name: "load_config"
          kind: function
