# Bash 基础定义与调用提取
metadata:
  language: bash
  description: "Bash 函数定义、调用、变量、条件"
  complexity: basic
  scip_required: false

fixtures:
  - id: function_definition
    files:
      script.sh: |
        #!/bin/bash
        greet() {
          echo "Hello, $1"
        }
    expected:
      symbols:
        - name: "greet"
          kind: function

  - id: function_with_local
    files:
      script.sh: |
        #!/bin/bash
        calculate() {
          local a=$1
          local b=$2
          echo $((a + b))
        }
    expected:
      symbols:
        - name: "calculate"
          kind: function

  - id: simple_call
    files:
      script.sh: |
        #!/bin/bash
        add() {
          echo $(( $1 + $2 ))
        }
        main() {
          add 1 2
        }
    expected:
      symbols:
        - name: "add"
          kind: function
        - name: "main"
          kind: function

  - id: multiple_functions
    files:
      script.sh: |
        #!/bin/bash
        setup() { echo "setup"; }
        teardown() { echo "teardown"; }
        run() {
          setup
          teardown
        }
    expected:
      symbols:
        - name: "setup"
          kind: function
        - name: "teardown"
          kind: function
        - name: "run"
          kind: function

  - id: function_with_args
    files:
      script.sh: |
        #!/bin/bash
        process_file() {
          local filename=$1
          local mode=$2
          echo "Processing $filename in $mode mode"
        }
    expected:
      symbols:
        - name: "process_file"
          kind: function

  - id: sourced_function
    files:
      lib.sh: |
        #!/bin/bash
        util_log() {
          echo "[LOG] $1"
        }
      script.sh: |
        #!/bin/bash
        source lib.sh
        util_log "starting"
    expected:
      symbols:
        - name: "util_log"
          kind: function

  - id: conditional_function
    files:
      script.sh: |
        #!/bin/bash
        check_status() {
          if [[ $1 -eq 0 ]]; then
            echo "OK"
          else
            echo "ERROR"
          fi
        }
    expected:
      symbols:
        - name: "check_status"
          kind: function

  - id: loop_function
    files:
      script.sh: |
        #!/bin/bash
        process_items() {
          for item in "$@"; do
            echo "$item"
          done
        }
    expected:
      symbols:
        - name: "process_items"
          kind: function
