# PHP 基础定义与调用提取
metadata:
  language: php
  description: "PHP 函数、类、接口、trait、命名空间、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: function_definition
    files:
      utils.php: |
        <?php
        function add($a, $b) {
          return $a + $b;
        }
    expected:
      symbols:
        - name: "add"
          kind: function

  - id: class_definition
    files:
      Point.php: |
        <?php
        class Point {
          public $x;
          public $y;
          public function distance() {
            return $this->x * $this->x + $this->y * $this->y;
          }
        }
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "distance"
          kind: method

  - id: interface_definition
    files:
      Reader.php: |
        <?php
        interface Reader {
          public function read();
        }
    expected:
      symbols:
        - name: "Reader"
          kind: interface
        - name: "read"
          kind: method

  - id: trait_definition
    files:
      Loggable.php: |
        <?php
        trait Loggable {
          public function log($message) {
            echo $message;
          }
        }
    expected:
      symbols:
        - name: "Loggable"
          kind: trait
        - name: "log"
          kind: method

  - id: simple_call
    files:
      main.php: |
        <?php
        function greet($name) {
          return "Hello, " . $name;
        }
        function main() {
          greet("world");
        }
    expected:
      symbols:
        - name: "greet"
          kind: function
        - name: "main"
          kind: function

  - id: namespace_definition
    files:
      App.php: |
        <?php
        namespace App;
        class Utils {
          public static function calculate($x) {
            return $x * 2;
          }
        }
    expected:
      symbols:
        - name: "Utils"
          kind: class
        - name: "calculate"
          kind: method

  - id: abstract_class
    files:
      Shape.php: |
        <?php
        abstract class Shape {
          abstract public function area();
          public function describe() {
            return "shape";
          }
        }
    expected:
      symbols:
        - name: "Shape"
          kind: class
        - name: "area"
          kind: method
        - name: "describe"
          kind: method

  - id: static_method
    files:
      Math.php: |
        <?php
        class Math {
          public static function max($a, $b) {
            return $a > $b ? $a : $b;
          }
        }
    expected:
      symbols:
        - name: "Math"
          kind: class
        - name: "max"
          kind: method

  - id: closure
    files:
      main.php: |
        <?php
        $multiply = function($a, $b) {
          return $a * $b;
        };
    expected:
      symbols:
        - name: "multiply"
          kind: function
