# PHP 边界与边缘场景
metadata:
  language: php
  description: "PHP 魔术方法、后期静态绑定、反射、生成器、闭包绑定、可变函数、可变变量、命名空间别名、组use声明、trait冲突解决、匿名类、属性(PHP8)、枚举(PHP8.1)、Fiber、match表达式、nullsafe运算符、命名参数、属性提升、readonly属性、枚举方法、First-class callable、Intersection types、Union types、Never type、Pure intersection types、Attributes"
  complexity: edge_cases
  scip_required: false

fixtures:
  - id: magic_methods
    files:
      main.php: |
        <?php
        class MagicBox {
            private array $data = [];
            public function __get(string $name): mixed {
                return $this->data[$name] ?? null;
            }
            public function __set(string $name, mixed $value): void {
                $this->data[$name] = $value;
            }
            public function __call(string $name, array $args): mixed {
                return "called $name";
            }
            public function __toString(): string {
                return json_encode($this->data);
            }
        }
    expected:
      symbols:
        - name: "MagicBox"
          kind: class

  - id: late_static_binding
    files:
      main.php: |
        <?php
        abstract class Model {
            public static function create(): static {
                return new static();
            }
        }
        class User extends Model {
            public string $name = '';
        }
    expected:
      symbols:
        - name: "Model"
          kind: class
        - name: "User"
          kind: class

  - id: generator
    files:
      main.php: |
        <?php
        function fibonacci(int $n): Generator {
            $a = 0; $b = 1;
            for ($i = 0; $i < $n; $i++) {
                yield $a;
                [$a, $b] = [$b, $a + $b];
            }
        }
    expected:
      symbols:
        - name: "fibonacci"
          kind: function

  - id: closure_bind
    files:
      main.php: |
        <?php
        class Counter {
            private int $count = 0;
            public function getIncrementor(): Closure {
                return Closure::bind(function() {
                    return ++$this->count;
                }, $this, self::class);
            }
        }
    expected:
      symbols:
        - name: "Counter"
          kind: class
        - name: "getIncrementor"
          kind: method

  - id: attribute_php8
    files:
      main.php: |
        <?php
        #[Attribute(Attribute::TARGET_METHOD)]
        class Route {
            public function __construct(public string $path, public string $method = 'GET') {}
        }
        class Controller {
            #[Route('/users', 'GET')]
            public function list(): array { return []; }
        }
    expected:
      symbols:
        - name: "Route"
          kind: class
        - name: "Controller"
          kind: class
        - name: "list"
          kind: method

  - id: enum_php81
    files:
      main.php: |
        <?php
        enum Status: string {
            case PENDING = 'pending';
            case ACTIVE = 'active';
            case COMPLETED = 'completed';
            public function label(): string {
                return match($this) {
                    self::PENDING => 'Pending',
                    self::ACTIVE => 'Active',
                    self::COMPLETED => 'Completed',
                };
            }
        }
    expected:
      symbols:
        - name: "Status"
          kind: enum
        - name: "label"
          kind: method

  - id: fiber
    files:
      main.php: |
        <?php
        $fiber = new Fiber(function (): void {
            $value = Fiber::suspend('start');
            echo "Received: $value\n";
        });
        $fiber->start();
        $fiber->resume('hello');
    expected:
      symbols: []

  - id: match_expression
    files:
      main.php: |
        <?php
        function describe(int $code): string {
            return match($code) {
                200 => 'OK',
                404 => 'Not Found',
                500 => 'Server Error',
                default => 'Unknown'
            };
        }
    expected:
      symbols:
        - name: "describe"
          kind: function

  - id: readonly_property
    files:
      main.php: |
        <?php
        class Config {
            public function __construct(
                public readonly string $host,
                public readonly int $port,
            ) {}
        }
    expected:
      symbols:
        - name: "Config"
          kind: class

  - id: union_intersection_types
    files:
      main.php: |
        <?php
        interface Drawable {}
        interface Resizable {}
        function process(Drawable&Resizable $item): void {}
        function find(string|int $id): ?array {
            return null;
        }
    expected:
      symbols:
        - name: "process"
          kind: function
        - name: "find"
          kind: function
