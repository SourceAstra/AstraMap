# Kotlin 边界与边缘场景
metadata:
  language: kotlin
  description: "Kotlin 内联函数、交叉inline、泛型约束、类型投影、委托属性、by lazy、observable、属性委托、密封类、when表达式、类型别名、typealias、函数类型、高阶函数、SAM转换、尾递归优化、挂起函数、Flow、Channel、协程上下文、Context receivers、Value classes、Data objects、expect/actual、KMP多平台"
  complexity: edge_cases
  scip_required: false

fixtures:
  - id: inline_function
    files:
      Main.kt: |
        inline fun <T> measureTime(block: () -> T): T {
            val start = System.currentTimeMillis()
            val result = block()
            val end = System.currentTimeMillis()
            println("Took ${end - start}ms")
            return result
        }
    expected:
      symbols:
        - name: "measureTime"
          kind: function

  - id: crossinline
    files:
      Main.kt: |
        inline fun runAsync(crossinline block: () -> Unit) {
            Thread { block() }.start()
        }
    expected:
      symbols:
        - name: "runAsync"
          kind: function

  - id: delegated_property
    files:
      Main.kt: |
        import kotlin.properties.Delegates
        class User {
            var name: String by Delegates.observable("") { _, old, new ->
                println("$old -> $new")
            }
            val lazyValue: String by lazy { "computed" }
        }
    expected:
      symbols:
        - name: "User"
          kind: class

  - id: typealias
    files:
      Main.kt: |
        typealias StringPredicate = (String) -> Boolean
        typealias IntMap = Map<String, Int>
        fun filterStrings(list: List<String>, predicate: StringPredicate): List<String> {
            return list.filter(predicate)
        }
    expected:
      symbols:
        - name: "filterStrings"
          kind: function

  - id: tailrec
    files:
      Main.kt: |
        tailrec fun factorial(n: Long, acc: Long = 1): Long {
            return if (n <= 1) acc else factorial(n - 1, n * acc)
        }
    expected:
      symbols:
        - name: "factorial"
          kind: function

  - id: suspend_function
    files:
      Main.kt: |
        import kotlinx.coroutines.*
        suspend fun fetchData(url: String): String {
            delay(100)
            return "data from $url"
        }
        suspend fun processUrls(urls: List<String>): List<String> {
            return urls.map { fetchData(it) }
        }
    expected:
      symbols:
        - name: "fetchData"
          kind: function
        - name: "processUrls"
          kind: function

  - id: flow_builder
    files:
      Main.kt: |
        import kotlinx.coroutines.flow.*
        fun numbers(): Flow<Int> = flow {
            for (i in 1..10) {
                emit(i)
            }
        }
        fun squaredNumbers(): Flow<Int> = numbers().map { it * it }
    expected:
      symbols:
        - name: "numbers"
          kind: function
        - name: "squaredNumbers"
          kind: function

  - id: expect_actual
    files:
      Main.kt: |
        expect class Platform {
            fun name(): String
        }
    expected:
      symbols:
        - name: "Platform"
          kind: class
        - name: "name"
          kind: method

  - id: value_class
    files:
      Main.kt: |
        value class UserId(val value: Int)
    expected:
      symbols:
        - name: "UserId"
          kind: class

  - id: data_object
    files:
      Main.kt: |
        data object SingletonData
    expected:
      symbols:
        - name: "SingletonData"
          kind: class

  - id: context_receiver
    files:
      Main.kt: |
        interface LoggingContext {
            fun log(msg: String)
        }
        context(LoggingContext)
        fun doWork() {
            log("working")
        }
    expected:
      symbols:
        - name: "LoggingContext"
          kind: interface
        - name: "doWork"
          kind: function

  - id: type_projection
    files:
      Main.kt: |
        fun copyTo(dest: Array<in Any>, src: Array<out Any>) {}
    expected:
      symbols:
        - name: "copyTo"
          kind: function

  - id: sam_conversion
    files:
      Main.kt: |
        fun interface Runnable {
            fun run()
        }
        fun execute(r: Runnable) { r.run() }
    expected:
      symbols:
        - name: "Runnable"
          kind: interface
        - name: "execute"
          kind: function

  - id: coroutine_context
    files:
      Main.kt: |
        import kotlinx.coroutines.*
        fun customContext(): CoroutineContext = Dispatchers.Default + Job()
    expected:
      symbols:
        - name: "customContext"
          kind: function

  - id: channel_usage
    files:
      Main.kt: |
        import kotlinx.coroutines.*
        import kotlinx.coroutines.channels.*
        suspend fun producer(ch: SendChannel<Int>) {
            for (i in 1..5) ch.send(i)
        }
    expected:
      symbols:
        - name: "producer"
          kind: function

  - id: function_type_alias
    files:
      Main.kt: |
        typealias Handler = (Int, String) -> Unit
        fun process(handler: Handler) { handler(1, "test") }
    expected:
      symbols:
        - name: "process"
          kind: function

  - id: property_delegation_custom
    files:
      Main.kt: |
        import kotlin.reflect.KProperty
        class ObservableProperty<T>(var value: T) {
            operator fun getValue(thisRef: Any?, property: KProperty<*>): T = value
            operator fun setValue(thisRef: Any?, property: KProperty<*>, newValue: T) { value = newValue }
        }
        class Person {
            var name: String by ObservableProperty("")
        }
    expected:
      symbols:
        - name: "ObservableProperty"
          kind: class
        - name: "Person"
          kind: class
