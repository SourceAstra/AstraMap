# Kotlin 基础定义与调用提取
metadata:
  language: kotlin
  description: "Kotlin 函数、类、接口、数据类、调用"
  complexity: basic
  scip_required: false

fixtures:
  - id: function_definition
    files:
      Main.kt: |
        fun add(a: Int, b: Int): Int {
          return a + b
        }
    expected:
      symbols:
        - name: "add"
          kind: function

  - id: class_definition
    files:
      Main.kt: |
        class Point(val x: Double, val y: Double) {
          fun distance(): Double {
            return x * x + y * y
          }
        }
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "distance"
          kind: method

  - id: interface_definition
    files:
      Main.kt: |
        interface Drawable {
          fun draw()
        }
    expected:
      symbols:
        - name: "Drawable"
          kind: interface
        - name: "draw"
          kind: method

  - id: data_class
    files:
      Main.kt: |
        data class User(val id: Int, val name: String)
    expected:
      symbols:
        - name: "User"
          kind: class

  - id: simple_call
    files:
      Main.kt: |
        fun greet(name: String): String {
          return "Hello, $name"
        }
        fun main() {
          greet("world")
        }
    expected:
      symbols:
        - name: "greet"
          kind: function
        - name: "main"
          kind: function

  - id: sealed_class
    files:
      Main.kt: |
        sealed class Result
        class Success(val data: String) : Result()
        class Error(val message: String) : Result()
    expected:
      symbols:
        - name: "Result"
          kind: class
        - name: "Success"
          kind: class
        - name: "Error"
          kind: class

  - id: object_declaration
    files:
      Main.kt: |
        object Singleton {
          fun doSomething() {}
        }
    expected:
      symbols:
        - name: "Singleton"
          kind: class
        - name: "doSomething"
          kind: method

  - id: enum_class
    files:
      Main.kt: |
        enum class Color {
          RED, GREEN, BLUE
        }
    expected:
      symbols:
        - name: "Color"
          kind: enum

  - id: extension_function
    files:
      Main.kt: |
        fun String.addExclamation(): String = this + "!"
        fun Int.double(): Int = this * 2
    expected:
      symbols:
        - name: "addExclamation"
          kind: function
        - name: "double"
          kind: function

  - id: destructuring_declaration
    files:
      Main.kt: |
        data class Point(val x: Int, val y: Int)
        fun process() {
            val (a, b) = Point(1, 2)
        }
    expected:
      symbols:
        - name: "Point"
          kind: class
        - name: "process"
          kind: function

  - id: when_expression
    files:
      Main.kt: |
        fun describe(n: Int): String = when (n) {
            0 -> "zero"
            1 -> "one"
            else -> "other"
        }
    expected:
      symbols:
        - name: "describe"
          kind: function

  - id: try_catch_finally
    files:
      Main.kt: |
        fun safeDivide(a: Int, b: Int): Int {
            return try {
                a / b
            } catch (e: ArithmeticException) {
                0
            } finally {
                println("done")
            }
        }
    expected:
      symbols:
        - name: "safeDivide"
          kind: function

  - id: property_getter_setter
    files:
      Main.kt: |
        class Person {
            var name: String = ""
                get() = field.uppercase()
                set(value) { field = value.trim() }
        }
    expected:
      symbols:
        - name: "Person"
          kind: class

  - id: lateinit_var
    files:
      Main.kt: |
        class LateInitDemo {
            lateinit var name: String
            fun init(n: String) { name = n }
        }
    expected:
      symbols:
        - name: "LateInitDemo"
          kind: class
        - name: "init"
          kind: method

  - id: inline_class
    files:
      Main.kt: |
        value class UserId(val value: Int)
    expected:
      symbols:
        - name: "UserId"
          kind: class

  - id: interface_with_property
    files:
      Main.kt: |
        interface Named {
            val name: String
        }
    expected:
      symbols:
        - name: "Named"
          kind: interface

  - id: function_reference
    files:
      Main.kt: |
        fun process(list: List<Int>): List<Int> {
            return list.filter(::isPositive)
        }
        fun isPositive(n: Int): Boolean = n > 0
    expected:
      symbols:
        - name: "process"
          kind: function
        - name: "isPositive"
          kind: function
